[package]
name = "slowroom-spotify"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]
members = ["vendor/librespot-core"]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
hound = "3.5"
log = "0.4"
librespot-core = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false, features = ["rustls-tls-webpki-roots", "ios-desktop-client"] }
librespot-playback = { git = "https://github.com/librespot-org/librespot", rev = "99b6088bf3ea028f90192676ac1a337fa4b2ed12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = 2
strip = "debuginfo"

[patch.crates-io]
sysinfo = { path = "vendor/sysinfo" }

[patch."https://github.com/librespot-org/librespot"]
librespot-core = { path = "vendor/librespot-core" }
